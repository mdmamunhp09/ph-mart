<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="poppins">
    <header>
        <nav>
            <div class="logo">
                <h1>PH MART</h1>
            </div>
            <div class="nav-links">
                <a href="products">Products</a>
                <a href="services">Services</a>
            </div>
        </nav>
        <section class="banner">
            <div class="banner-content">
                <h1>Best products within budget</h1>
                <p>Efficiently incentivize diverse methods of empowerment and goal-oriented networks. Globally promote
                    multifunctional models after emerging interfaces.</p>
                <button>Shop Now</button>
            </div>
            <div class="banner-image">
                <img src="images/hero-img.jpeg" alt="It is a banner image">
            </div>
        </section>
    </header>
    <main>
        <section class="" id="products-section">
            <h1>Featured Products</h1>
            <div class="products">
                <div class="product-card">
                    <img src="images/airpod.jpeg" alt="">
                    <h3>$65</h3>
                    <button>Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="images/charger.jpeg" alt="">
                    <h3>$70</h3>
                    <button>Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="images/earphone.jpeg" alt="">
                    <h3>$30</h3>
                    <button>Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="images/new-pod.jpeg" alt="">
                    <h3>$90</h3>
                    <button>Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="images/wireless.jpeg" alt="">
                    <h3>$50</h3>
                    <button>Buy Now</button>
                </div>
                <div class="product-card">
                    <img src="images/pod-case.jpeg" alt="">
                    <h3>$60</h3>
                    <button>Buy Now</button>
                </div>
            </div>
        </section>
      
    </main>
</body>

</html>
